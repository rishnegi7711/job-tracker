name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    # Pinned so a runner image change can't break CI unannounced; bump deliberately.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      # Dummy values: env.ts exits without them. Not real secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
      - run: bun run test --run

  client:
    # Pinned so a runner image change can't break CI unannounced; bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: client
      - run: bun run test --run
        working-directory: client
